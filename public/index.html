<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>⚡ Cyber Arena — Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000508;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }

        /* Animated grid background on the page itself */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,150,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,150,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        #game-wrapper {
            position: relative;
            z-index: 1;
        }

        #game-container {
            width: 640px;
            height: 480px;
            position: relative;
        }

        /* Neon border glow around the canvas */
        #game-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border: 2px solid rgba(0,200,255,0.7);
            box-shadow:
                0 0 10px rgba(0,200,255,0.5),
                0 0 30px rgba(0,150,255,0.3),
                inset 0 0 10px rgba(0,200,255,0.1);
            pointer-events: none;
            z-index: 10;
        }

        /* Corner decorations */
        #game-container::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 1px solid rgba(0,100,200,0.3);
            pointer-events: none;
            z-index: 10;
        }

        /* Corner dots */
        .corner {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00ddff;
            box-shadow: 0 0 8px #00ddff;
            z-index: 12;
        }
        .corner.tl { top: -4px; left: -4px; }
        .corner.tr { top: -4px; right: -4px; }
        .corner.bl { bottom: -4px; left: -4px; }
        .corner.br { bottom: -4px; right: -4px; }

        /* Game title above */
        .game-title {
            text-align: center;
            color: rgba(0,200,255,0.5);
            font-size: 13px;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Status bar below */
        .game-footer {
            text-align: center;
            color: rgba(0,100,150,0.7);
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        /* Scanline overlay on the whole page */
        .scanline-overlay {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Animated pulse on the border */
        @keyframes borderPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0,200,255,0.5), 0 0 30px rgba(0,150,255,0.3), inset 0 0 10px rgba(0,200,255,0.1); }
            50%       { box-shadow: 0 0 15px rgba(0,200,255,0.7), 0 0 45px rgba(0,150,255,0.4), inset 0 0 15px rgba(0,200,255,0.15); }
        }
        #game-container::before { animation: borderPulse 3s ease-in-out infinite; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div class="scanline-overlay"></div>
    <div id="game-wrapper">
        <div class="game-title">⚡ C Y B E R &nbsp; A R E N A ⚡</div>
        <div id="game-container">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
        <div class="game-footer">WASD MOVE &nbsp;|&nbsp; CLICK/P SHOOT &nbsp;|&nbsp; N RELOAD</div>
    </div>

    <script src="js/LobbyScene.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
